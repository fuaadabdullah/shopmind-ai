name: CI - Tests, Migrations, Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  tests:
    name: Tests (Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=85 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Comment PR with coverage report
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  migrations:
    name: Database Migrations Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: migration_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Check if all migrations are applied
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/migration_test
        run: |
          python -c "
          import subprocess
          import sys
          from sqlalchemy import create_engine
          
          # Run pending migrations
          subprocess.run(['alembic', 'upgrade', 'head'], check=True)
          
          # Verify no more migrations pending
          result = subprocess.run(['alembic', 'current'], capture_output=True, text=True)
          print('Migration status:', result.stdout)
          
          if 'head' not in result.stdout:
              print('ERROR: Database not at head migration!')
              sys.exit(1)
          print('✓ All migrations applied successfully')
          "

      - name: Verify schema integrity
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/migration_test
        run: |
          python check_db_schema.py

  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Black (code formatting check)
        run: |
          black --check --diff app/ tests/ scripts/

      - name: Run isort (import sorting check)
        run: |
          isort --check-only --diff app/ tests/ scripts/

      - name: Run Ruff (fast linting)
        run: |
          ruff check app/ tests/ scripts/

      - name: Run Pylint (detailed linting)
        run: |
          pylint app/ \
            --fail-under=8.0 \
            --exit-zero || true
        continue-on-error: true

      - name: Run mypy (type checking)
        run: |
          mypy app/ tests/ \
            --ignore-missing-imports \
            --no-error-summary || true
        continue-on-error: true

  build-status:
    name: CI Status
    needs: [tests, migrations, lint]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        if: needs.tests.result == 'failure'
        run: |
          echo "❌ Tests failed - blocking merge"
          exit 1

      - name: Check migration results
        if: needs.migrations.result == 'failure'
        run: |
          echo "❌ Migration checks failed - blocking merge"
          exit 1

      - name: Check lint results
        if: needs.lint.result == 'failure'
        run: |
          echo "❌ Linting failed - blocking merge"
          exit 1

      - name: CI Passed ✓
        run: |
          echo "✓ All CI checks passed!"
          echo "✓ Tests: ${{ needs.tests.result }}"
          echo "✓ Migrations: ${{ needs.migrations.result }}"
          echo "✓ Linting: ${{ needs.lint.result }}"
