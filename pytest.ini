[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Coverage options
addopts = 
    --strict-markers
    --tb=short
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    e2e_torch: End-to-end Torch integration tests (no mocking in critical path)
    slow: Slow running tests
